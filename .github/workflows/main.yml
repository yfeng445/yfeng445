name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate WakaTime metrics
        run: node .github/scripts/generate-wakatime-card.mjs
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_RANGE: all_time

      - name: Commit WakaTime metrics
        run: |
          if git diff --quiet -- wakatime-metrics.svg; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wakatime-metrics.svg
          git commit -m "Update wakatime-metrics.svg - [Skip GitHub Action]"
          git push

      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
