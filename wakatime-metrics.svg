    .label { fill: #c9d1d9; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .track { fill: #21262d; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; }
      .title { fill: #1f2328; }
      .subtitle, .value { fill: #656d76; }
      .heading { fill: #0969da; }
      .label { fill: #1f2328; }
      .track { fill: #eaeef2; }
    }
  </style>
